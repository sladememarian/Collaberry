[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# importlib mode lets identically-named test modules coexist across services.
addopts = -ra -q --import-mode=importlib
# Put the services root on sys.path so `auth.app.main`, `workspace.app.main`, …
# resolve on the host exactly as they do inside each container (WORKDIR /app).
pythonpath = services .
testpaths =
    services/common/tests
    services/auth/tests
    services/workspace/tests
    services/presence/tests
    services/notification/tests
    tests/e2e
markers =
    e2e: end-to-end tests that require the full stack running behind Envoy
    stress: load / stress tests
