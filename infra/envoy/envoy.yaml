# Collaberry edge proxy.
#
# This is the ONLY thing the host can reach. Everything behind it lives on the
# internal compose network. Envoy's jobs here:
#   * terminate the single public listener on :8080
#   * fan requests out to the right microservice by path prefix
#   * verify RS256 access tokens against auth-service's JWKS (public routes skip it)
#   * carry the decoded identity down to services as `x-user-*` headers
#   * open CORS for the RN client and upgrade the WebSocket for live sync
#   * shed load with a small per-connection local rate limit
#
# Auth endpoints, the JWKS document, and the WS handshake are deliberately left
# open: login/register have no token yet, and the socket carries its JWT in the
# query string (presence-service checks it there).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge_http
                codec_type: AUTO
                # Generous idle timeout so long-lived WebSockets don't get culled.
                common_http_protocol_options:
                  idle_timeout: 900s
                upgrade_configs:
                  - upgrade_type: websocket
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      # Default format logs the full path. The WS handshake carries
                      # the access token in the query string (browsers can't set an
                      # Authorization header on an upgrade), so the default would
                      # write valid 12-hour JWTs into container logs. %REQ(:PATH)%
                      # is replaced with the query-stripped path below.
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %UPSTREAM_HOST%\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: collaberry
                      domains: ["*"]
                      # CORS: answer preflight OPTIONS at the edge.
                      # Note: the cors: field under virtual_hosts generates a deprecation warning
                      # in Envoy v1.31+ but remains fully functional. The replacement
                      # (typed_per_filter_config with CorsPolicy) requires runtime filter ordering
                      # that conflicts with jwt_authn in this version. We keep the working form.
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              regex: ".*"
                        allow_methods: GET, POST, PATCH, PUT, DELETE, OPTIONS
                        allow_headers: authorization, content-type, x-requested-with
                        expose_headers: content-length, content-type
                        max_age: "86400"
                      routes:
                        # ---- WebSocket: presence-service, no jwt_authn (token in query) ----
                        - match: { prefix: "/ws/" }
                          route:
                            cluster: presence-service
                            timeout: 0s          # never time out the socket
                            upgrade_configs:
                              - upgrade_type: websocket
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true

                        # ---- Auth service (public: no token required) ----
                        - match: { prefix: "/api/v1/auth" }
                          route: { cluster: auth-service }
                          typed_per_filter_config:
                            envoy.filters.http.jwt_authn:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                              disabled: true

                        # ---- Workspace & content (protected) ----
                        - match: { prefix: "/api/v1/workspace" }
                          route: { cluster: workspace-service }

                        # ---- Presence REST snapshots + lock API (protected) ----
                        - match: { prefix: "/api/v1/presence" }
                          route: { cluster: presence-service }

                        # ---- Notifications (protected) ----
                        - match: { prefix: "/api/v1/notifications" }
                          route: { cluster: notification-service }

                http_filters:
                  # 1) CORS must run early.
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # 2) Local rate limit: token bucket, refilled every second.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: edge_rl
                      token_bucket:
                        max_tokens: 200
                        tokens_per_fill: 200
                        fill_interval: 1s
                      filter_enabled:
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        default_value: { numerator: 100, denominator: HUNDRED }
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header: { key: x-ratelimit, value: "edge" }

                  # 3) JWT authentication. Validates RS256 tokens against the JWKS
                  #    that auth-service publishes, then forwards claims downstream.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        collaberry_auth:
                          issuer: collaberry-auth
                          audiences: [collaberry-clients]
                          forward: true      # keep the Authorization header for services
                          forward_payload_header: x-jwt-payload
                          claim_to_headers:
                            - header_name: x-user-id
                              claim_name: sub
                            - header_name: x-user-email
                              claim_name: email
                          remote_jwks:
                            http_uri:
                              uri: http://auth-service:8000/api/v1/auth/.well-known/jwks.json
                              cluster: auth-service
                              timeout: 5s
                            cache_duration: 300s
                            async_fetch: {}
                      rules:
                        # Everything under /api requires a good token unless a route
                        # above disabled this filter (auth + ws).
                        - match: { prefix: "/api/" }
                          requires: { provider_name: collaberry_auth }

                  # 4) Terminal router.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth-service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      load_assignment:
        cluster_name: auth-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth-service, port_value: 8000 }

    - name: workspace-service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      load_assignment:
        cluster_name: workspace-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: workspace-service, port_value: 8000 }

    - name: presence-service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      load_assignment:
        cluster_name: presence-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: presence-service, port_value: 8000 }

    - name: notification-service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 2s
      load_assignment:
        cluster_name: notification-service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: notification-service, port_value: 8000 }
