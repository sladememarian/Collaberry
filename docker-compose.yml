# Collaberry — full stack.
#
# Design rule from the spec: ONLY Envoy is published to the host. Every service,
# plus Mongo and Redis, sits on the internal `nexus-net` bridge and is reachable
# only by its neighbours. The RSA signing key is generated once by auth-service
# into the shared `keys` volume; the other services mount it read-only.

name: collaberry

x-service-base: &service-base
  restart: unless-stopped
  env_file: .env
  networks: [nexus-net]

networks:
  nexus-net:
    driver: bridge

volumes:
  mongo-data:
  keys:

services:
  mongo:
    image: mongo:7
    <<: *service-base
    volumes:
      - mongo-data:/data/db
    ports:
      # Dev-only convenience so MongoDB Compass (or mongosh) on the host can
      # inspect data directly. Bound to loopback only — not reachable from the
      # network. Nothing inside the stack uses this; services talk to `mongo`
      # over the internal nexus-net network regardless.
      # NOTE: host port is 27018, not the default 27017 — this machine already
      # has an unrelated Mongo container bound to 27017 (a different database;
      # that's why Compass on the default port never showed Collaberry's data).
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *service-base
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    volumes:
      - keys:/keys
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20

  workspace-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: workspace/Dockerfile
    volumes:
      - keys:/keys:ro
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20

  presence-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: presence/Dockerfile
    volumes:
      - keys:/keys:ro
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20

  notification-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: notification/Dockerfile
    volumes:
      - keys:/keys:ro
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    # Worker with a tiny health http; no ingress through Envoy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 20

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    <<: *service-base
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "collaberry-edge"]
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"   # the ONLY port exposed to the host (boxd proxy forwards to 8080)
      - "9901:9901"   # Envoy admin (handy for debugging; drop in prod)
    depends_on:
      auth-service: {condition: service_healthy}
      workspace-service: {condition: service_healthy}
      presence-service: {condition: service_healthy}
